services:
  mysql:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-rootpassword}"
      MARIADB_DATABASE: "${MYSQL_DATABASE:-hercules}"
      MARIADB_USER: "${MYSQL_USER:-hercules}"
      MARIADB_PASSWORD: "${MYSQL_PASSWORD:-hercules}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql-files/main.sql:/docker-entrypoint-initdb.d/01-main.sql:ro
      - ./sql-files/logs.sql:/docker-entrypoint-initdb.d/02-logs.sql:ro
      - ./sql-files/item_db_re.sql:/docker-entrypoint-initdb.d/03-item_db_re.sql:ro
      - ./sql-files/mob_db_re.sql:/docker-entrypoint-initdb.d/04-mob_db_re.sql:ro
      - ./sql-files/mob_skill_db_re.sql:/docker-entrypoint-initdb.d/05-mob_skill_db_re.sql:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  login-server:
    build: .
    image: hercules:latest
    environment:
      SERVICE: "login-server"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      MYSQL_USER: "${MYSQL_USER:-hercules}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-hercules}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-hercules}"
      INTER_USERID: "${INTER_USERID:-s1}"
      INTER_PASSWORD: "${INTER_PASSWORD:-p1}"
      LOGIN_PORT: "${LOGIN_PORT:-6900}"
    ports:
      - "${LOGIN_PORT:-6900}:${LOGIN_PORT:-6900}"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "${LOGIN_PORT:-6900}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  char-server:
    build: .
    image: hercules:latest
    environment:
      SERVICE: "char-server"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      MYSQL_USER: "${MYSQL_USER:-hercules}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-hercules}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-hercules}"
      INTER_USERID: "${INTER_USERID:-s1}"
      INTER_PASSWORD: "${INTER_PASSWORD:-p1}"
      LOGIN_HOST: "login-server"
      LOGIN_PORT: "${LOGIN_PORT:-6900}"
      CHAR_IP: "${CHAR_IP:-127.0.0.1}"
      CHAR_PORT: "${CHAR_PORT:-6121}"
    ports:
      - "${CHAR_PORT:-6121}:${CHAR_PORT:-6121}"
    depends_on:
      mysql:
        condition: service_healthy
      login-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "${CHAR_PORT:-6121}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  map-server:
    build: .
    image: hercules:latest
    environment:
      SERVICE: "map-server"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      MYSQL_USER: "${MYSQL_USER:-hercules}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-hercules}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-hercules}"
      INTER_USERID: "${INTER_USERID:-s1}"
      INTER_PASSWORD: "${INTER_PASSWORD:-p1}"
      CHAR_HOST: "char-server"
      CHAR_PORT: "${CHAR_PORT:-6121}"
      MAP_IP: "${MAP_IP:-127.0.0.1}"
      MAP_PORT: "${MAP_PORT:-5121}"
    ports:
      - "${MAP_PORT:-5121}:${MAP_PORT:-5121}"
    volumes:
      - ./conf/import:/opt/hercules/conf/import
      - ./save:/opt/hercules/save
      - ./log:/opt/hercules/log
    depends_on:
      mysql:
        condition: service_healthy
      char-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "${MAP_PORT:-5121}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api-server:
    build: .
    image: hercules:latest
    environment:
      SERVICE: "api-server"
      MYSQL_HOST: "mysql"
      MYSQL_PORT: "${MYSQL_PORT:-3306}"
      MYSQL_USER: "${MYSQL_USER:-hercules}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-hercules}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-hercules}"
      INTER_USERID: "${INTER_USERID:-s1}"
      INTER_PASSWORD: "${INTER_PASSWORD:-p1}"
      LOGIN_HOST: "login-server"
      LOGIN_PORT: "${LOGIN_PORT:-6900}"
      CHAR_HOST: "char-server"
      CHAR_PORT: "${CHAR_PORT:-6121}"
      API_IP: "${API_IP:-127.0.0.1}"
      API_PORT: "${API_PORT:-7121}"
    ports:
      - "${API_PORT:-7121}:${API_PORT:-7121}"
    depends_on:
      mysql:
        condition: service_healthy
      char-server:
        condition: service_healthy
    restart: unless-stopped

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "8000:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
